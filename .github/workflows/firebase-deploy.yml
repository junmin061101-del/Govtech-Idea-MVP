# 테스트 → 정적 빌드 → Firebase Hosting 배포
#  - main에 push: 개발(dev) 프로젝트 대시보드 사이트에 배포
#    (Firestore 규칙·인덱스는 자주 바뀌지 않아 수동 배포: npx firebase deploy --only firestore --project dev)
#    (운영 프로젝트를 만들면 prod로 바꾼다)
#  - PR: 개발(dev) 프로젝트의 미리보기 채널에 배포
#  - 데이터 자동 갱신 커밋("[skip ci]")에는 돌지 않는다 (배포는 data-refresh.yml이 함)
# 필요한 GitHub Secrets
#  FIREBASE_SERVICE_ACCOUNT_DEV / FIREBASE_SERVICE_ACCOUNT_PROD : 서비스 계정 JSON
#  NEXT_PUBLIC_KAKAO_MAP_API_KEY
#  FIREBASE_WEB_CONFIG_DEV / FIREBASE_WEB_CONFIG_PROD : 아래 형식의 여러 줄 값
#     NEXT_PUBLIC_FIREBASE_API_KEY=...
#     NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=...
#     NEXT_PUBLIC_FIREBASE_PROJECT_ID=...
#     NEXT_PUBLIC_FIREBASE_APP_ID=...
name: firebase-deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      TARGET: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      # 배포용 비밀값이 없으면 테스트까지만 하고 배포는 건너뛴다
      - name: 배포 비밀값 확인
        id: ready
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV || secrets.FIREBASE_SERVICE_ACCOUNT_CAREOS_DEV_1103174 }}
        run: |
          if [ -z "$SA" ]; then echo "::notice::배포 건너뜀 — FIREBASE_SERVICE_ACCOUNT_DEV 미등록"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - run: npm run test:rules
      - name: 웹 설정 주입
        if: steps.ready.outputs.ok == 'true'
        run: |
          echo "NEXT_PUBLIC_KAKAO_MAP_API_KEY=${{ secrets.NEXT_PUBLIC_KAKAO_MAP_API_KEY }}" >> .env.production.local
          echo "${{ secrets.FIREBASE_WEB_CONFIG_DEV }}" >> .env.production.local
      - run: npm run build
        if: steps.ready.outputs.ok == 'true'
      - name: 미리보기 배포 (PR → dev)
        if: github.event_name == 'pull_request' && steps.ready.outputs.ok == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV || secrets.FIREBASE_SERVICE_ACCOUNT_CAREOS_DEV_1103174 }}
          projectId: dev
          target: dashboard
      - name: 배포 (main → dev 대시보드 사이트)
        if: github.event_name == 'push' && steps.ready.outputs.ok == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV || secrets.FIREBASE_SERVICE_ACCOUNT_CAREOS_DEV_1103174 }}
          projectId: dev
          target: dashboard
          channelId: live
