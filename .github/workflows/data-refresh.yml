# 공공데이터 자동 갱신 — 장표의 갱신 주기 그대로
#
#   시설 정보 매일         매일 03:00 KST   어린이집 정보 수집 → 데이터 빌드 → 배포 (데이터 기준일 갱신)
#   시설 변경 시 즉시 반영  매시간 :05       어린이집 정보 변경 감지 → 바뀐 경우만 빌드·배포 (1시간 안에 반영)
#   공백 지도 매주         매주 월 04:00 KST  어린이집·행정동 인구·대중교통 재수집 → 2SFCA 배분 재계산 → 배포
#   (시점 비교)           매월 1일 05:00 KST 월별 스냅샷 저장
#
# 안전장치: 받아 온 데이터가 이상하면(시설 −10% 초과 감소 등) scripts/refresh.mjs가 직전 데이터를 유지하고
# 실패로 끝내므로 배포하지 않는다. 바뀐 데이터는 저장소에 "[skip ci]" 커밋으로 남긴다(다음 비교 기준).
#
# 필요한 GitHub Secrets
#   SEOUL_OPEN_DATA_API_KEY          서울 열린데이터광장 일반 인증키
#   NEXT_PUBLIC_KAKAO_MAP_API_KEY    카카오맵 JavaScript 키
#   FIREBASE_WEB_CONFIG_DEV          NEXT_PUBLIC_FIREBASE_API_KEY=… 등 네 줄
#   FIREBASE_SERVICE_ACCOUNT_DEV     배포용 서비스 계정 JSON
# GitHub의 예약 실행은 붐비는 시간에 몇 분~수십 분 늦게 시작될 수 있다.
name: data-refresh

on:
  schedule:
    - cron: "5 * * * *" # 매시간 — 시설 변경 감지
    - cron: "0 18 * * *" # 매일 03:00 KST — 시설 정보
    - cron: "0 19 * * 0" # 매주 월 04:00 KST — 공백 지도 전체 재계산
    - cron: "0 20 1 * *" # 매월 1일 05:00 KST — 스냅샷
  workflow_dispatch:
    inputs:
      mode:
        description: "갱신 종류"
        type: choice
        options: [hourly, daily, weekly, monthly]
        default: daily

concurrency:
  group: data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 비밀값이 아직 등록되지 않았으면 실패 대신 건너뛴다 (등록하는 즉시 다음 예약부터 동작)
      - name: 비밀값 확인
        id: ready
        env:
          K1: ${{ secrets.SEOUL_OPEN_DATA_API_KEY }}
          K2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
          K3: ${{ secrets.FIREBASE_WEB_CONFIG_DEV }}
          K4: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_API_KEY }}
        run: |
          missing=""
          [ -z "$K1" ] && missing="$missing SEOUL_OPEN_DATA_API_KEY"
          [ -z "$K2" ] && missing="$missing FIREBASE_SERVICE_ACCOUNT_DEV"
          [ -z "$K3" ] && missing="$missing FIREBASE_WEB_CONFIG_DEV"
          [ -z "$K4" ] && missing="$missing NEXT_PUBLIC_KAKAO_MAP_API_KEY"
          if [ -n "$missing" ]; then
            echo "::notice::자동 갱신 대기 중 — GitHub Secrets 미등록:$missing"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.ready.outputs.ok == 'true'

      - name: 갱신 종류 정하기
        if: steps.ready.outputs.ok == 'true'
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            m="${{ inputs.mode }}"
          else
            case "${{ github.event.schedule }}" in
              "5 * * * *")  m=hourly ;;
              "0 18 * * *") m=daily ;;
              "0 19 * * 0") m=weekly ;;
              "0 20 1 * *") m=monthly ;;
            esac
          fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"
          echo "갱신 종류: $m"

      - name: 공공데이터 수집·검증·빌드
        if: steps.ready.outputs.ok == 'true'
        id: refresh
        env:
          SEOUL_OPEN_DATA_API_KEY: ${{ secrets.SEOUL_OPEN_DATA_API_KEY }}
        run: node scripts/refresh.mjs --mode=${{ steps.mode.outputs.mode }}

      - name: 테스트
        if: steps.refresh.outputs.changed == 'true'
        run: npm test

      - name: 정적 빌드
        if: steps.refresh.outputs.changed == 'true'
        run: |
          echo "NEXT_PUBLIC_KAKAO_MAP_API_KEY=${{ secrets.NEXT_PUBLIC_KAKAO_MAP_API_KEY }}" >> .env.production.local
          echo "${{ secrets.FIREBASE_WEB_CONFIG_DEV }}" >> .env.production.local
          npm run build

      - name: Firebase 배포 (대시보드 사이트)
        if: steps.refresh.outputs.changed == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx firebase deploy --only hosting:dashboard --project dev --non-interactive

      - name: 갱신 데이터 기록
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name "careos-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/cache src/data public/data
          if git diff --cached --quiet; then echo "기록할 변경 없음"; exit 0; fi
          git commit -m "data: 자동 갱신 (${{ steps.mode.outputs.mode }}) [skip ci]"
          git push
